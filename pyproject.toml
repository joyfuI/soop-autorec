[project]
name = "soop-autorec"
version = "0.1.0"
description = "SOOP channel auto recording service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=48.0.1",
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.32",
  "streamlink>=8.4.0",
  "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".uv-cache", ".venv", "__pycache__", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
